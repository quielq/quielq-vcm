[project]
name = "vcm"
version = "0.1.0"
description = "Tiny on-device Voice Command Model (AI222 / AI231 machine exercise)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sounddevice",
    "librosa",
    "soundfile",
    "requests",
    "python-miio",
    "pynput",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]
rpi = ["gpiozero", "sense-hat"]
# ONNX Runtime inference: what the Raspberry Pi needs instead of torch (DEPLOYMENT.md).
deploy = ["onnxruntime"]
# Exporting/quantizing a trained checkpoint to ONNX (scripts/export_onnx.py).
train = ["torch", "onnx", "onnxruntime", "onnxscript"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcm = ["home/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

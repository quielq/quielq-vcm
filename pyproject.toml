[project]
name = "vcm"
version = "0.1.0"
description = "Tiny on-device Voice Command Model (AI222 machine exercise)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "sounddevice",
    "librosa",
    "requests",
    "python-miio",
    "pynput",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]
rpi = ["gpiozero", "sense-hat"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
